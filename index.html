<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="description" content="Beslutsstöd för yttre tjänst vid ingripanden där alkohol påträffas hos unga – med lagrum och dokumentationskrav.">
<title>Alkohol – Ingripandestöd</title>
<style>
:root{
  color-scheme: light dark;

  --bg:#f4f5f7;
  --surface:#ffffff;
  --surface-2:#f9fafb;
  --surface-3:#eef0f4;
  --line:#e2e5ea;
  --line-strong:#cdd3dc;

  --text:#14181f;
  --text-2:#4b5563;
  --text-3:#6b7280;

  --accent:#1d4ed8;
  --accent-weak:#e8eeff;
  --accent-text:#1d4ed8;

  --red:#b91c1c;   --red-bg:#fef2f2;   --red-line:#fca5a5;
  --amber:#a16207; --amber-bg:#fffbeb; --amber-line:#fcd34d;
  --green:#15803d; --green-bg:#f0fdf4; --green-line:#86efac;
  --blue:#1d4ed8;  --blue-bg:#eff6ff;  --blue-line:#93c5fd;

  --shadow-sm:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 2px 4px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.08);

  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
  --sp:16px;
  --maxw:720px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117;
    --surface:#161b22;
    --surface-2:#1c2129;
    --surface-3:#232a33;
    --line:#2a313b;
    --line-strong:#3a424e;

    --text:#e8ecf1;
    --text-2:#a8b3c1;
    --text-3:#8b95a3;

    --accent:#4f8cff;
    --accent-weak:#16233c;
    --accent-text:#8ab4ff;

    --red:#f87171;   --red-bg:#2a1417;   --red-line:#7f2a2a;
    --amber:#fbbf24; --amber-bg:#2a2010; --amber-line:#7c5a12;
    --green:#4ade80; --green-bg:#0f2418; --green-line:#1e6b3c;
    --blue:#7dabff;  --blue-bg:#12203a;  --blue-line:#2c4c86;

    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 4px 20px rgba(0,0,0,.45);
  }
}

:root[data-theme="dark"]{
  --bg:#0d1117;
  --surface:#161b22;
  --surface-2:#1c2129;
  --surface-3:#232a33;
  --line:#2a313b;
  --line-strong:#3a424e;

  --text:#e8ecf1;
  --text-2:#a8b3c1;
  --text-3:#8b95a3;

  --accent:#4f8cff;
  --accent-weak:#16233c;
  --accent-text:#8ab4ff;

  --red:#f87171;   --red-bg:#2a1417;   --red-line:#7f2a2a;
  --amber:#fbbf24; --amber-bg:#2a2010; --amber-line:#7c5a12;
  --green:#4ade80; --green-bg:#0f2418; --green-line:#1e6b3c;
  --blue:#7dabff;  --blue-bg:#12203a;  --blue-line:#2c4c86;

  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 20px rgba(0,0,0,.45);
}

*,*::before,*::after{box-sizing:border-box;}
*{margin:0;padding:0;}

html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  padding-bottom:env(safe-area-inset-bottom);
}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
a{color:var(--accent-text);}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

.skip{
  position:absolute;left:-9999px;top:0;z-index:100;
  background:var(--surface);padding:10px 16px;border-radius:0 0 var(--r-md) 0;
}
.skip:focus{left:0;}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--sp);}

/* ---------- Header ---------- */
.appbar{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.appbar-row{display:flex;align-items:center;gap:12px;padding:10px 0;}
.mark{
  width:38px;height:38px;border-radius:11px;flex:none;
  background:linear-gradient(140deg,#2563eb,#1e3a8a);
  color:#fff;display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(37,99,235,.35);
}
.mark svg{width:20px;height:20px;}
.brand{flex:1;min-width:0;}
.brand b,.brand span{
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand b{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.2;}
.brand span{font-size:12px;color:var(--text-3);}

.icon-btn{
  width:38px;height:38px;border-radius:10px;flex:none;
  display:grid;place-items:center;color:var(--text-2);
  border:1px solid var(--line);background:var(--surface-2);
}
.icon-btn:hover{background:var(--surface-3);color:var(--text);}
.icon-btn svg{width:18px;height:18px;}
.icon-btn[aria-pressed="true"]{background:var(--accent-weak);color:var(--accent-text);border-color:var(--accent);}

/* ---------- Progress ---------- */
.steps{display:flex;gap:4px;padding-bottom:10px;}
.step{flex:1;min-width:0;}
.step-bar{height:3px;border-radius:99px;background:var(--line-strong);transition:background .35s ease;}
.step.done .step-bar{background:var(--accent);}
.step.now .step-bar{background:color-mix(in srgb, var(--accent) 55%, var(--line-strong));}
.step.final.done .step-bar{background:var(--green);}
.step-name{
  font-size:9.5px;text-align:center;margin-top:5px;color:var(--text-3);
  font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.step.done .step-name,.step.now .step-name{color:var(--text-2);}
.step.final.done .step-name{color:var(--green);}

/* ---------- Answer chips ---------- */
.answers{display:flex;flex-wrap:wrap;gap:6px;padding-top:14px;}
.tag{
  font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;
  background:var(--surface-3);color:var(--text-2);border:1px solid var(--line);
}

/* ---------- Question ---------- */
main{padding:14px 0 40px;}

.linkback{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--text-2);font-size:14px;font-weight:600;
  padding:8px 0;margin-bottom:2px;
}
.linkback:hover{color:var(--text);}
.linkback svg{width:15px;height:15px;}

h1{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.2;margin:4px 0 6px;}
h2{font-size:15px;font-weight:650;letter-spacing:-.01em;}
.lede{color:var(--text-2);font-size:14.5px;margin-bottom:20px;max-width:52ch;}

.options{display:flex;flex-direction:column;gap:10px;}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:14px 16px;min-height:64px;
  box-shadow:var(--shadow-sm);
  transition:border-color .15s ease, transform .1s ease, box-shadow .15s ease;
}
.opt:hover{border-color:var(--line-strong);box-shadow:var(--shadow-md);}
.opt:active{transform:scale(.988);}
.opt-key{
  width:42px;height:42px;border-radius:12px;flex:none;
  display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:-.02em;
}
.opt-key.red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line);}
.opt-key.amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-line);}
.opt-key.blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-line);}
.opt-key.green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-line);}
.opt-key.grey{background:var(--surface-3);color:var(--text-2);border:1px solid var(--line-strong);}
.opt-body{flex:1;min-width:0;}
.opt-title{font-size:16px;font-weight:650;letter-spacing:-.01em;}
.opt-hint{font-size:13px;color:var(--text-3);margin-top:2px;}
.opt-chevron{color:var(--text-3);flex:none;}
.opt-chevron svg{width:16px;height:16px;display:block;}

/* ---------- Verdict ---------- */
.verdict{
  display:flex;gap:14px;align-items:flex-start;
  border-radius:var(--r-xl);padding:16px;margin-bottom:18px;border:1px solid;
}
.verdict.alert{background:var(--red-bg);border-color:var(--red-line);}
.verdict.minor{background:var(--amber-bg);border-color:var(--amber-line);}
.verdict.clear{background:var(--green-bg);border-color:var(--green-line);}
.verdict-icon{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;}
.verdict.alert .verdict-icon{background:var(--red);color:var(--red-bg);}
.verdict.minor .verdict-icon{background:var(--amber);color:var(--amber-bg);}
.verdict.clear .verdict-icon{background:var(--green);color:var(--green-bg);}
.verdict-icon svg{width:22px;height:22px;}
.verdict-title{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.25;}
.verdict.alert .verdict-title{color:var(--red);}
.verdict.minor .verdict-title{color:var(--amber);}
.verdict.clear .verdict-title{color:var(--green);}
.verdict-text{font-size:13.5px;color:var(--text-2);margin-top:5px;}

/* ---------- Result sections ---------- */
.section{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-xl);margin-bottom:14px;overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.section-head{
  display:flex;align-items:center;gap:9px;padding:12px 16px;
  border-bottom:1px solid var(--line);background:var(--surface-2);
}
.section-head svg{width:16px;height:16px;flex:none;}
.section-head .label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;}
.section-head .count{
  margin-left:auto;font-size:11px;font-weight:700;
  min-width:20px;height:20px;padding:0 6px;border-radius:99px;
  display:grid;place-items:center;background:var(--surface-3);color:var(--text-2);
}
.section.red   .section-head{background:var(--red-bg);}   .section.red   .section-head .label,.section.red   .section-head svg{color:var(--red);}
.section.amber .section-head{background:var(--amber-bg);} .section.amber .section-head .label,.section.amber .section-head svg{color:var(--amber);}
.section.green .section-head{background:var(--green-bg);} .section.green .section-head .label,.section.green .section-head svg{color:var(--green);}
.section.blue  .section-head{background:var(--blue-bg);}  .section.blue  .section-head .label,.section.blue  .section-head svg{color:var(--blue);}

.items{display:flex;flex-direction:column;}
.item{padding:14px 16px;border-top:1px solid var(--line);}
.item:first-child{border-top:none;}
.item-title{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.35;}
.item-desc{font-size:14px;color:var(--text-2);margin-top:5px;}
.item ul{margin:8px 0 0;padding-left:0;list-style:none;}
.item li{
  position:relative;padding-left:16px;font-size:14px;color:var(--text-2);
  margin-top:5px;line-height:1.5;
}
.item li::before{
  content:"";position:absolute;left:3px;top:.62em;
  width:4px;height:4px;border-radius:99px;background:var(--line-strong);
}
.item.flag{background:var(--amber-bg);border-left:3px solid var(--amber);}
.item.flag .item-title{color:var(--amber);}

.laws{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.law{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:600;line-height:1.3;
  padding:4px 9px 4px 7px;border-radius:7px;
  background:var(--surface-3);border:1px solid var(--line);
  color:var(--text-2);text-decoration:none;
}
.law:hover{border-color:var(--accent);color:var(--accent-text);}
.law::before{content:"§";font-weight:700;color:var(--accent-text);}

/* ---------- Notes / actions ---------- */
.note{
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--r-md);padding:13px 15px;font-size:13.5px;color:var(--text-2);
  margin-bottom:14px;
}
.note b{color:var(--text);font-weight:650;}

.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.btn{
  flex:1 1 140px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;padding:0 18px;border-radius:var(--r-md);
  font-size:15px;font-weight:650;letter-spacing:-.01em;
  border:1px solid var(--line);background:var(--surface);
  transition:background .15s ease,border-color .15s ease;
}
.btn svg{width:17px;height:17px;}
.btn:hover{background:var(--surface-3);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{filter:brightness(1.08);}

/* ---------- Reference / footer ---------- */
.legend{margin-top:28px;}
.legend-title,.foot-title{
  font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:10px;
}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
.legend-item{
  display:flex;align-items:center;gap:9px;padding:10px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
}
.legend-item svg{width:15px;height:15px;flex:none;}
.legend-item span{font-size:12px;font-weight:650;letter-spacing:.03em;}
.legend-item .desc{display:block;font-size:11px;font-weight:500;color:var(--text-3);letter-spacing:0;}

.reflist{display:flex;flex-direction:column;gap:2px;}
.refrow{
  display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);
  font-size:13.5px;text-decoration:none;color:var(--text);align-items:baseline;
}
.refrow:last-child{border-bottom:none;}
.refrow:hover .refrow-name{color:var(--accent-text);}
.refrow-sfs{
  flex:none;width:88px;font-size:11.5px;font-weight:700;color:var(--text-3);
  font-variant-numeric:tabular-nums;
}
.refrow-name{flex:1;}
.refrow-note{display:block;font-size:12px;color:var(--text-3);margin-top:1px;}

footer{
  border-top:1px solid var(--line);margin-top:36px;padding:20px 0 32px;
  font-size:12.5px;color:var(--text-3);line-height:1.6;
}
footer p+p{margin-top:8px;}
footer b{color:var(--text-2);}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);
  background:var(--text);color:var(--bg);
  padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow-md);opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;z-index:60;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (min-width:640px){
  h1{font-size:30px;}
  .steps{gap:6px;}
  .step-name{font-size:10px;}
}

@media (prefers-reduced-motion:no-preference){
  .enter{animation:enter .32s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes enter{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
}

@media print{
  .appbar,.actions,.legend,.linkback,.toast{display:none !important;}
  body{background:#fff;color:#000;font-size:11pt;}
  .section,.item,.verdict{break-inside:avoid;box-shadow:none;}
  .law{border:1px solid #999;}
  a{text-decoration:none;color:#000;}
}
</style>
</head>

<a class="skip" href="#main">Hoppa till innehåll</a>

<div class="appbar">
  <div class="wrap">
    <div class="appbar-row">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.1 8 11 4.6-1.9 8-6 8-11V5l-8-3Z"/></svg></div>
      <div class="brand">
        <b>Alkohol · Ingripandestöd</b>
        <span id="brandSub">Yttre tjänst · beslutsstöd</span>
      </div>
      <button class="icon-btn" id="btnRefs" type="button" aria-pressed="false" title="Lagrum och källor" aria-label="Lagrum och källor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
      </button>
      <button class="icon-btn" id="btnTheme" type="button" title="Växla ljust/mörkt läge" aria-label="Växla ljust/mörkt läge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
    <div class="steps" id="steps" role="group" aria-label="Förlopp"></div>
  </div>
</div>

<main id="main"><div class="wrap" id="view"></div></main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ============================================================
   Lagrum – varje referens pekar mot gällande författning.
   Kontrollerad mot lagtext augusti 2026.
   ============================================================ */
const SFS = {
  al:   "https://lagen.nu/2010:1622",
  fva:  "https://lagen.nu/1958:205",
  ffe:  "https://lagen.nu/2024:782",
  ol:   "https://lagen.nu/1993:1617",
  brb:  "https://lagen.nu/1962:700",
  rb:   "https://lagen.nu/1942:740",
  lul:  "https://lagen.nu/1964:167",
  sol:  "https://lagen.nu/2025:400",
  lob:  "https://lagen.nu/1976:511"
};

const LAW = {
  al_3_7:   ["3 kap. 7 § alkohollagen", SFS.al + "#K3P7"],
  al_3_9:   ["3 kap. 9 § alkohollagen", SFS.al + "#K3P9"],
  al_11_3:  ["11 kap. 3 § alkohollagen", SFS.al + "#K11P3"],
  al_11_4:  ["11 kap. 4 § alkohollagen", SFS.al + "#K11P4"],
  al_11_7:  ["11 kap. 7 § alkohollagen", SFS.al + "#K11P7"],
  al_11_10: ["11 kap. 10 § alkohollagen", SFS.al + "#K11P10"],
  al_12_1:  ["12 kap. 1 § alkohollagen", SFS.al + "#K12P1"],
  fva_1:    ["1 § lagen (1958:205)", SFS.fva + "#P1"],
  fva_2:    ["2 § lagen (1958:205)", SFS.fva + "#P2"],
  ffe_4:    ["4 § lagen (2024:782)", SFS.ffe + "#P4"],
  ol_3_8:   ["3 kap. 8 § ordningslagen", SFS.ol + "#K3P8"],
  ol_3_22:  ["3 kap. 22 § 2 st ordningslagen", SFS.ol + "#K3P22"],
  brb_1_6:  ["1 kap. 6 § brottsbalken", SFS.brb + "#K1P6"],
  rb_27:    ["27 kap. rättegångsbalken", SFS.rb + "#K27"],
  lul_5:    ["5 § LUL", SFS.lul + "#P5"],
  lul_6:    ["6 § LUL", SFS.lul + "#P6"],
  lul_31:   ["31 § LUL", SFS.lul + "#P31"],
  sol_19_1: ["19 kap. 1 § socialtjänstlagen", SFS.sol + "#K19P1"],
  lob_1:    ["1 § LOB (1976:511)", SFS.lob + "#P1"]
};

const REFS = [
  ["2010:1622","Alkohollagen", SFS.al, "Åldersgränser (3 kap. 7 §), anskaffningsförbud (3 kap. 9 §), straff (11 kap.) och förverkande (12 kap. 1 §)."],
  ["1958:205","Lagen om förverkande av alkohol m.m.", SFS.fva, "Förverkande vid förtäring i strid med lokal ordningsföreskrift (1 §) samt beslag och bevislig förstöring vid ringa värde (2 §)."],
  ["2024:782","Lagen om förfarandet vid förverkande", SFS.ffe, "Ersatte lagen (1986:1009) den 8 november 2024. Polisman får besluta om förverkande upp till en tiondels prisbasbelopp (4 §)."],
  ["1993:1617","Ordningslagen", SFS.ol, "Kommunens rätt att meddela lokala ordningsföreskrifter (3 kap. 8 §) och straffet penningböter (3 kap. 22 § andra stycket)."],
  ["1962:700","Brottsbalken", SFS.brb, "Straffmyndighetsåldern 15 år (1 kap. 6 §)."],

function h(tag, props, kids){
  const n = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "on") for (const e in v) n.addEventListener(e, v[e]);
    else n.setAttribute(k, v);
  }
  if (kids) kids.forEach(c => { if (c) n.appendChild(c); });
  return n;
}

function lawChips(keys){
  if (!keys || !keys.length) return null;
  const box = h("div", { class:"laws" });
  keys.forEach(k => {
    const l = LAW[k];
    if (!l) return;
    box.appendChild(h("a", {
      class:"law", href:l[1], target:"_blank", rel:"noopener noreferrer", text:l[0]
    }));
  });
  return box;
}

function renderItem(it){
  const node = h("div", { class:"item" + (it.tone === "flag" ? " flag" : "") });
  node.appendChild(h("div", { class:"item-title", text:it.t }));
  if (it.d) node.appendChild(h("p", { class:"item-desc", text:it.d }));
  if (it.lines && it.lines.length){
    const ul = h("ul");
    it.lines.forEach(li => ul.appendChild(h("li", { text:li })));
    node.appendChild(ul);
  }
  const chips = lawChips(it.law);
  if (chips) node.appendChild(chips);
  return node;
}

function option(o){
  const btn = h("button", { class:"opt enter", type:"button", on:{ click:o.onClick },
    style:"animation-delay:" + o.delay + "ms" });
  btn.appendChild(h("div", { class:"opt-key " + o.tone, text:o.key }));
  const body = h("div", { class:"opt-body" }, [
    h("div", { class:"opt-title", text:o.title }),
    o.hint ? h("div", { class:"opt-hint", text:o.hint }) : null
  ]);
  btn.appendChild(body);
  btn.appendChild(h("div", { class:"opt-chevron", html:SVG.chevron }));
  return btn;
}

function advance(key, val){
  state.hist.push(state.step);
  state.ans[key] = val;
  let next = NEXT[key];
  if (key === "drinking") next = (state.ans.age === "20plus") ? "handover" : "source";
  state.step = next || "result";
  render();
  window.scrollTo({ top:0, behavior:"instant" in window ? "instant" : "auto" });
}

function back(){
  if (!state.hist.length) return;
  const prev = state.hist.pop();
  const flow = flowFor(state.ans.age);
  const i = flow.indexOf(prev);
  if (i > -1) flow.slice(i).forEach(k => delete state.ans[k]);
  state.step = prev;
  render();
}

function reset(){
  state = { step:"age", ans:{}, hist:[], view:"wizard" };
  render();
  window.scrollTo({ top:0 });
}

let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function resultAsText(){
  const a = state.ans;
  const lines = ["ALKOHOL – INGRIPANDESTÖD", ""];
  lines.push("Underlag: " + flowFor(a.age).filter(k => a[k]).map(k => LABELS[k][a[k]]).join(" · "));
  lines.push("");
  const res = buildResult();
  SECTIONS.forEach(([key, , label]) => {
    if (!res[key].length) return;
    lines.push(label.toUpperCase());
    res[key].forEach(it => {
      lines.push("- " + it.t);
      if (it.d) lines.push("  " + it.d);
      if (it.lines) it.lines.forEach(l => lines.push("    * " + l));
      if (it.law) lines.push("  Lagrum: " + it.law.map(k => LAW[k] && LAW[k][0]).filter(Boolean).join("; "));
    });
    lines.push("");
  });
  lines.push("Beslutsstöd – ersätter inte lagtext eller egen rättslig bedömning.");
  return lines.join("\n");
}

function copyResult(){
  const text = resultAsText();
  const done = () => toast("Underlaget kopierat");
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, fallback);
  } else fallback();
  function fallback(){
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); }
    catch(e){ toast("Kunde inte kopiera"); }
    document.body.removeChild(ta);
  }
}

function renderSteps(){
  const box = document.getElementById("steps");
  box.innerHTML = "";
  if (state.view !== "wizard"){ box.style.display = "none"; return; }
  box.style.display = "flex";
  const flow = flowFor(state.ans.age);
  const idx = state.step === "result" ? flow.length : flow.indexOf(state.step);
  flow.forEach((s, i) => {
    const cls = "step" + (i < idx ? " done" : i === idx ? " now" : "");
    box.appendChild(h("div", { class:cls }, [
      h("div", { class:"step-bar" }),
      h("div", { class:"step-name", text:STEPS[s].name })
    ]));
  });
  box.appendChild(h("div", { class:"step final" + (state.step === "result" ? " done" : "") }, [
    h("div", { class:"step-bar" }),
    h("div", { class:"step-name", text:"Resultat" })
  ]));
}

function renderRefs(view){
  view.appendChild(h("h1", { text:"Lagrum och källor" }));
  view.appendChild(h("p", { class:"lede", text:"Samtliga hänvisningar i stödet pekar mot gällande författningstext. Kontrollerad i augusti 2026." }));
  const list = h("div", { class:"reflist" });
  REFS.forEach(([sfs, name, url, note]) => {
    list.appendChild(h("a", { class:"refrow", href:url, target:"_blank", rel:"noopener noreferrer" }, [
      h("span", { class:"refrow-sfs", text:sfs }),
      h("span", { class:"refrow-name" }, [
        h("b", { text:name }),
        h("span", { class:"refrow-note", text:note })
      ])
    ]));
  });
  view.appendChild(list);

  view.appendChild(h("div", { class:"note", style:"margin-top:22px" }, [
    h("b", { text:"Ändringar att hålla reda på. " }),
    h("span", { text:"Lagen (1986:1009) om förfarandet i vissa fall vid förverkande upphävdes den 8 november 2024 och ersattes av lagen (2024:782). Socialtjänstlagen (2001:453) ersattes den 1 juli 2025 av socialtjänstlagen (2025:400). Äldre rutinbeskrivningar och blanketter kan fortfarande hänvisa till de upphävda lagarna." })
  ]));

  view.appendChild(h("div", { class:"actions" }, [
    h("button", { class:"btn primary", type:"button", on:{ click:() => { state.view = "wizard"; render(); } } }, [
      h("span", { html:SVG.back }), h("span", { text:"Tillbaka till stödet" })
    ])
  ]));
}

function renderQuestion(view){
  const s = state.step;

  if (state.hist.length){
    view.appendChild(h("button", { class:"linkback", type:"button", on:{ click:back } }, [
      h("span", { html:SVG.back }), h("span", { text:"Tillbaka" })
    ]));
  }

  const opts = h("div", { class:"options" });

  if (s === "age"){
    view.appendChild(h("h1", { text:"Hur gammal är personen?" }));
    view.appendChild(h("p", { class:"lede", text:"Utgångsläge: polis träffar på någon som har alkohol med sig. Åldern styr både brottsrubricering och vilka underrättelser som måste göras." }));
    [
      ["u15","Under 15 år","Inte straffmyndig · vårdnadshavare och orosanmälan","red","<15"],
      ["15to17","15–17 år","Straffmyndig men omyndig · LUL och orosanmälan","amber","15"],
      ["18to19","18–19 år","Myndig men under 20 – langning är fortfarande brott","amber","18"],
      ["20plus","20 år eller äldre","Får lagligen köpa och inneha alkohol","blue","20+"]
    ].forEach(([v, t, hint, tone, key], i) =>
      opts.appendChild(option({ key, tone, title:t, hint, delay:i*45, onClick:() => advance("age", v) })));
  }

  else if (s === "area"){
    view.appendChild(h("h1", { text:"Förbjudet område?" }));
    view.appendChild(h("p", { class:"lede", text:"Befinner sig personen på en plats där kommunens allmänna lokala ordningsföreskrifter förbjuder alkoholförtäring?" }));
    [
      ["ja","Ja – inom förbudsområde","Förtäring där är straffbelagd med penningböter","red","Ja"],
      ["nej","Nej – utanför förbudsområde",null,"grey","Nej"],
      ["osaker","Osäker","Stödet flaggar för att föreskriften måste kontrolleras","amber","?"]
    ].forEach(([v, t, hint, tone, key], i) =>
      opts.appendChild(option({ key, tone, title:t, hint, delay:i*45, onClick:() => advance("area", v) })));
  }

  else if (s === "drinking"){
    view.appendChild(h("h1", { text:"Iakttagen förtäring?" }));
    view.appendChild(h("p", { class:"lede", text:"Har du eller en kollega direkt observerat att personen druckit alkohol? Enbart innehav räcker inte för att en förtäringsöverträdelse ska kunna styrkas." }));
    [
      ["ja","Ja – förtäring iakttagen","Egen iakttagelse eller kollegas","red","Ja"],
      ["nej","Nej – ingen iakttagelse","Endast innehav har konstaterats","grey","Nej"]
    ].forEach(([v, t, hint, tone, key], i) =>
      opts.appendChild(option({ key, tone, title:t, hint, delay:i*45, onClick:() => advance("drinking", v) })));
  }

  else if (s === "source"){
    view.appendChild(h("h1", { text:"Finns en känd källa?" }));
    view.appendChild(h("p", { class:"lede", text:"Finns det en identifierad eller misstänkt person som tillhandahållit alkoholen? Svaret avgör om alkoholen ska tas i beslag som bevis eller förverkas direkt på plats." }));
    [
      ["ja","Ja – känd eller misstänkt källa","Alkoholen har bevisvärde → beslag","red","Ja"],
      ["nej","Nej – källan är okänd","Inget bevisbehov → förverkande på plats","grey","Nej"]
    ].forEach(([v, t, hint, tone, key], i) =>
      opts.appendChild(option({ key, tone, title:t, hint, delay:i*45, onClick:() => advance("source", v) })));
  }

  else if (s === "handover"){
    view.appendChild(h("h1", { text:"Vem är alkoholen till?" }));
    view.appendChild(h("p", { class:"lede", text:"Personen får själv inneha alkoholen. Men att anskaffa åt någon under 20 år är brott – även utan ersättning. Att bjuda på förtäring på stället omfattas dock inte." }));
    [
      ["ja","Avsedd för någon under 20 år","Misstanke om olovligt anskaffande","red","Ja"],
      ["oklart","Oklart","Behandlas som öppen misstanke","amber","?"],
      ["nej","Endast för eget bruk eller sällskap över 20","Inget alkoholbrott","grey","Nej"]
    ].forEach(([v, t, hint, tone, key], i) =>
      opts.appendChild(option({ key, tone, title:t, hint, delay:i*45, onClick:() => advance("handover", v) })));
  }

  view.appendChild(opts);

  // Färgnyckel
  const legend = h("div", { class:"legend" });
  legend.appendChild(h("div", { class:"legend-title", text:"Så presenteras resultatet" }));
  const grid = h("div", { class:"legend-grid" });
  SECTIONS.forEach(([, tone, label, icon, desc]) => {
    const item = h("div", { class:"legend-item" });
    const ic = h("span", { html:icon });
    ic.firstChild.style.color = "var(--" + (tone === "red" ? "red" : tone === "amber" ? "amber" : tone === "green" ? "green" : "blue") + ")";
    item.appendChild(ic);
    item.appendChild(h("span", { text:label }, [ h("span", { class:"desc", text:desc }) ]));
    grid.appendChild(item);
  });
  legend.appendChild(grid);
  view.appendChild(legend);
}

function renderResult(view){
  const a = state.ans;
  const res = buildResult();
  const localOffence = a.area === "ja" && a.drinking === "ja";
  const minor = a.age !== "20plus";

  let tone, title, text;
  if (!res.brott.length){
    tone = "clear"; title = "Inget brott konstaterat";
    text = "Personen är 20 år eller äldre, ingen förtäringsöverträdelse har iakttagits och inget talar för langning. Alkoholen kan inte förverkas.";
  } else if (minor){
    tone = "alert"; title = "Brottsmisstanke föreligger";
    text = "Misstanken riktas mot den som tillhandahållit alkoholen – inte mot den unge, som är fri från ansvar för medverkan." +
           (localOffence && a.age !== "u15" ? " Den unge kan däremot lagföras för förtäringen på platsen." : "");
  } else if (localOffence && !(a.handover === "ja" || a.handover === "oklart")){
    tone = "minor"; title = "Ordningsförseelse";
    text = "Förtäring i strid med lokal ordningsföreskrift. Penningböter och förverkande av alkoholen.";
  } else {
    tone = "alert"; title = "Brottsmisstanke föreligger";
    text = "Misstanke om olovligt anskaffande. Se rubriceringar och åtgärder nedan.";
  }

  const verdict = h("div", { class:"verdict enter " + tone });
  verdict.appendChild(h("div", { class:"verdict-icon", html: tone === "clear" ? SVG.check : SVG.alert }));
  verdict.appendChild(h("div", {}, [
    h("div", { class:"verdict-title", text:title }),
    h("p", { class:"verdict-text", text:text })
  ]));
  view.appendChild(verdict);

  let delay = 60;
  SECTIONS.forEach(([key, toneName, label, icon]) => {
    const items = res[key];
    if (!items.length) return;
    const sec = h("div", { class:"section enter " + toneName, style:"animation-delay:" + delay + "ms" });
    delay += 60;
    const head = h("div", { class:"section-head" });
    head.appendChild(h("span", { html:icon }));
    head.appendChild(h("span", { class:"label", text:label }));
    head.appendChild(h("span", { class:"count", text:String(items.length) }));
    sec.appendChild(head);
    const body = h("div", { class:"items" });
    items.forEach(it => body.appendChild(renderItem(it)));
    sec.appendChild(body);
    view.appendChild(sec);
  });

  view.appendChild(h("div", { class:"note" }, [
    h("b", { text:"Helhetsbedömning. " }),
    h("span", { text:"Stödet visar de vanligaste utfallen. Ringa gärningar är straffria enligt 11 kap. 10 § alkohollagen, och omständigheterna i det enskilda ärendet kan leda till en annan bedömning. Kontrollera alltid gällande kommunal föreskrift, brottskod och ordningsbotskatalog." })
  ]));

  view.appendChild(h("div", { class:"actions" }, [
    h("button", { class:"btn", type:"button", on:{ click:copyResult } }, [
      h("span", { html:SVG.copy }), h("span", { text:"Kopiera underlag" })
    ]),
    h("button", { class:"btn", type:"button", on:{ click:() => window.print() } }, [
      h("span", { html:SVG.print }), h("span", { text:"Skriv ut" })
    ]),
    h("button", { class:"btn primary", type:"button", on:{ click:reset } }, [
      h("span", { html:SVG.restart }), h("span", { text:"Ny kontroll" })
    ])
  ]));
}

function render(){
  const view = document.getElementById("view");
  view.innerHTML = "";
  renderSteps();

  document.getElementById("btnRefs").setAttribute("aria-pressed", String(state.view === "refs"));

  const sub = document.getElementById("brandSub");
  const flow = flowFor(state.ans.age);
  const picked = flow.filter(k => state.ans[k]).map(k => LABELS[k][state.ans[k]]);
  sub.textContent = picked.length ? picked.join(" · ") : "Yttre tjänst · beslutsstöd";

  if (state.view === "refs") renderRefs(view);
  else if (state.step === "result") renderResult(view);
  else renderQuestion(view);

  const foot = h("footer", {}, [
    h("p", {}, [
      h("b", { text:"Detta är ett beslutsstöd, inte en rättskälla. " }),
      h("span", { text:"Det ersätter varken lagtext, Polismyndighetens rutiner eller den egna rättsliga bedömningen i det enskilda fallet." })
    ]),
    h("p", { text:"Lagrum kontrollerade mot gällande författningstext i augusti 2026. Kommunala ordningsföreskrifter, brottskoder och ordningsbotskatalogen ändras oftare än lagtexten – verifiera dem lokalt." })
  ]);
  view.appendChild(foot);
}

/* ---------- Tema ---------- */
const THEME_KEY = "ingripandestod-theme";
function applyTheme(t){
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
try { applyTheme(localStorage.getItem(THEME_KEY)); } catch(e){}

document.getElementById("btnTheme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur ? (cur === "dark" ? "light" : "dark") : (dark ? "light" : "dark");
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch(e){}
});

document.getElementById("btnRefs").addEventListener("click", () => {
  state.view = state.view === "refs" ? "wizard" : "refs";
  render();
  window.scrollTo({ top:0 });
});

/* ---------- Tangentbord ---------- */
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;

  if (e.key === "Escape" || e.key === "Backspace"){
    if (state.view === "refs"){ state.view = "wizard"; render(); e.preventDefault(); }
    else if (state.hist.length && state.step !== "result"){ back(); e.preventDefault(); }
    return;
  }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9){
    const btns = document.querySelectorAll("#view .options .opt");
    if (btns[n-1]){ btns[n-1].click(); e.preventDefault(); }
  }
});

render();
</script>
