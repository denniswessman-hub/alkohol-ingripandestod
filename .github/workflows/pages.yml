name: Publicera till GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Konfigurera Pages
        uses: actions/configure-pages@v5
        with:
          # Slår på Pages för repot om det inte redan är aktiverat.
          enablement: true

      - name: Paketera webbplatsen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
